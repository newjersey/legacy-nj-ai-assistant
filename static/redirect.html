        body {
            margin: 0;
            padding: 0;

        }
        
        .redirect-header {
            display: flex;
            align-items: center;
            padding: 16px 36px;
            background: #ffffff;
            border-bottom: 1px solid #e6e6e6;
        }
        
        .header-logo {
            height: 32px;
            width: auto;
        }
        
        .header-title {
            font-style: normal;
            font-weight: 600;
            font-size: 20px;
            line-height: 28px;
            color: #242424;
            margin-left: 14px;
        }
        
        .redirect-container {
            max-width: 800px;
            margin: 80px auto;
            padding: 48px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);

        }
        
        .redirect-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        
        .redirect-heading {
            font-size: 32px;
            font-weight: 600;
            color: #1b1b1b;
            margin-bottom: 16px;
        }
        
        .redirect-message {
            font-size: 18px;
            line-height: 28px;
            color: #71767a;
            margin-bottom: 32px;
        }
        
        .usa-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #005ea2;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        
        .usa-button:hover {
            background-color: #0b4778;
        }
        
        .usa-button:focus {
            outline: 4px solid #2491ff;
            outline-offset: 2px;
        }
        
        .auto-redirect-note {
            margin-top: 32px;
            font-size: 14px;
            color: #71767a;
        }
        
        @media (max-width: 768px) {
            .redirect-container {
                margin: 40px 16px;
                padding: 32px 24px;
            }
            
            .redirect-heading {
                font-size: 24px;
            }
